openapi: 3.0.0
info:
  title: Haggle Proof Ledger - WhatsApp Trading API
  description: >
    API documentation for the Haggle Proof Ledger backend. 
    Covers User Authentication, Inventory Management, Sales Management, and Virtual Account Management.
  version: 1.0.0

servers:
  - url: /api
    description: Base API path

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
    refreshTokenAuth:
      type: apiKey
      in: cookie
      name: refreshToken

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [admin, trader]
        emailVerified:
          type: boolean
        businessName:
          type: string
        businessCategory:
          type: string
        targetMonthlyRevenue:
          type: number

    InventoryItem:
      type: object
      properties:
        id:
          type: integer
        productName:
          type: string
        quantityInStock:
          type: integer
        costPrice:
          type: number
        sellingPrice:
          type: number

    Sale:
      type: object
      properties:
        id:
          type: integer
        inventoryId:
          type: integer
        userId:
          type: string
        quantity:
          type: integer
        total:
          type: number
        createdAt:
          type: string
          format: date-time

    VirtualAccount:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        accountName:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        balance:
          type: number

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

paths:
  # --- USER AUTHENTICATION & PASSWORD MANAGEMENT ---
  /users/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phoneNumber, password]
              properties:
                name: { type: string }
                email: { type: string }
                phoneNumber: { type: string }
                password: { type: string }
      responses:
        '201':
          description: User created, OTP sent to email
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify user email with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string }
                otp: { type: string }
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: Invalid or expired OTP
        '404':
          description: User not found

  /users/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login successful. Note that users must have verified their email via /verify-email before they can log in.
          headers:
            Set-Cookie:
              description: accessToken and refreshToken cookies
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid credentials
        '403':
          description: Forbidden - Email not verified

  /users/password-reset/request:
    post:
      tags:
        - Password Management
      summary: Request password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200':
          description: OTP sent to email
        '404':
          description: User not found

  /users/password-reset/new:
    post:
      tags:
        - Password Management
      summary: Set new password after OTP verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, otp]
              properties:
                email: { type: string }
                password: { type: string }
                otp: { type: string }
      responses:
        '200':
          description: Password updated successfully
        '404':
          description: User not found or update failed

  /users/update-business-details:
    post:
      tags:
        - User Management
      summary: Update business details
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName: { type: string }
                businessCategory: { type: string }
                targetMonthlyRevenue: { type: number }
      responses:
        '200':
          description: Business details updated successfully
        '401':
          description: Unauthorized

  /users/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      responses:
        '200':
          description: Logout successful

  /users/renew-token:
    post:
      tags:
        - Authentication
      summary: Renew access token using refresh token
      security:
        - refreshTokenAuth: []
      responses:
        '200':
          description: Token renewed successfully
        '401':
          description: Refresh token missing, invalid, or revoked

  /users/whatsapp-verification:
    get:
      tags:
        - Onboarding
      summary: Get WhatsApp verification code and link
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Verification code and link generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string }
                  whatsappLink: { type: string }
        '401':
          description: Unauthorized
        '404':
          description: User not found

  # --- INVENTORY MANAGEMENT ---
  /inventory:
    get:
      tags:
        - Inventory Management
      summary: Get all inventory items
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryItem' }

  /inventory/add:
    post:
      tags:
        - Inventory Management
      summary: Add or update an inventory item
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productName, quantityInStock, costPrice, sellingPrice]
              properties:
                productName: { type: string }
                quantityInStock: { type: integer }
                costPrice: { type: number }
                sellingPrice: { type: number }
      responses:
        '200':
          description: Item added or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }

  /inventory/remove:
    post:
      tags:
        - Inventory Management
      summary: Remove quantity from an inventory item
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, quantity]
              properties:
                id: { type: integer }
                quantity: { type: integer }
      responses:
        '200':
          description: Quantity removed successfully
        '400':
          description: Insufficient quantity or item not found

  # --- SALES MANAGEMENT ---
  /sales/sales:
    post:
      tags:
        - Sales Management
      summary: Record a new sale
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryId, userId, quantity, total]
              properties:
                inventoryId: { type: integer }
                userId: { type: string }
                quantity: { type: integer }
                total: { type: number }
      responses:
        '201':
          description: Sale recorded successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sale' }

    get:
      tags:
        - Sales Management
      summary: Retrieve sales records
      security:
        - cookieAuth: []
      parameters:
        - name: productName
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
      responses:
        '200':
          description: List of sales records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sale' }

  # --- ACCOUNT MANAGEMENT ---
  /accounts/create:
    post:
      tags:
        - Account Management
      summary: Create a virtual account
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, middle_name, mobile_num, dob, email, bvn, gender, address, beneficiary_account, beneficiary_bank_code, withdrawal_pin]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                middle_name: { type: string }
                mobile_num: { type: string }
                dob: { type: string, format: date }
                email: { type: string, format: email }
                bvn: { type: string }
                gender: { type: string }
                address: { type: string }
                beneficiary_account: { type: string }
                beneficiary_bank_code: { type: string }
                withdrawal_pin: { type: string }
      responses:
        '201':
          description: Virtual account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data: { $ref: '#/components/schemas/VirtualAccount' }

  /accounts/update/{id}:
    patch:
      tags:
        - Account Management
      summary: Update virtual account info
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Account updated successfully

  /accounts/delete/{id}:
    delete:
      tags:
        - Account Management
      summary: Delete virtual account
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account deleted successfully

  /accounts/webhook:
    post:
      tags:
        - Account Management
      summary: Squad webhook for virtual account transactions (Credits & Debits)
      description: >
        Unauthenticated endpoint for SquadCo asynchronous notifications. 
        SECURITY: This endpoint MUST be validated using the `x-squad-signature` header verified against the raw request body. 
        Handles `charge_successful` (Credit), `transfer.success`, and `transfer.failed` (Refund) events.
      parameters:
        - name: x-squad-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Webhook processed successfully

  /accounts/lookup:
    get:
      tags:
        - Account Management
      summary: Lookup destination bank account details before withdrawal
      security:
        - cookieAuth: []
      parameters:
        - name: bank_code
          in: query
          required: true
          schema: { type: string }
        - name: account_number
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account details retrieved successfully
        '400':
          description: Validation error or lookup failed

  /accounts/withdraw:
    post:
      tags:
        - Account Management
      summary: Withdraw funds from virtual account to a real bank account
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, pin]
              properties:
                amount: { type: number }
                pin: { type: string }
      responses:
        '200':
          description: Withdrawal initiated successfully
        '400':
          description: Invalid PIN or insufficient funds
        '502':
          description: Transfer failed

  /accounts/history:
    get:
      tags:
        - Account Management
      summary: Get all withdrawal transfer history
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    amount: { type: number }
                    status: { type: string }
                    transaction_reference: { type: string }
                    createdAt: { type: string, format: date-time }
